# Lobby NL OSINT Pipeline — Actor Categories Configuration
# 50 categorieën zoals gedefinieerd in de ActorCategory enum

categories:
  # === HOOFDCATEGORIEËN (8) ===
  pro_israel_org:
    label: "Pro-Israël organisatie"
    description: "Organisaties die Israël-advocacy bedrijven in Nederland"
    misclassification_risk: null

  christian_zionist_org:
    label: "Christenzionistische organisatie"
    description: "Christelijk-zionistische organisaties (apart van joodse en pro-Israël)"
    misclassification_risk: null

  jewish_civic_org:
    label: "Joodse maatschappelijke organisatie"
    description: "Joodse maatschappelijke/culturele/religieuze organisaties"
    misclassification_risk: "HIGH — niet automatisch als pro-Israël lobby classificeren"

  israeli_diplomatic_channel:
    label: "Israëlisch diplomatiek kanaal"
    description: "Israëlische ambassade, consulaten, officiële staatskanalen"
    classification: "state/diplomatic — niet NGO lobby"

  antisemitism_policy_infrastructure:
    label: "Antisemitismebestrijding infrastructuur"
    description: "Overheids- en semi-overheidsorganen voor antisemitisme bestrijding"
    misclassification_risk: "HIGH — niet automatisch als Zionist classificeren"

  parliamentary_actor:
    label: "Parlementaire actor"
    description: "Kamerleden, commissieleden, parlementaire netwerken"

  palestine_rights_counter_lobby:
    label: "Tegenlobby Palestina-rechten"
    description: "Organisaties die Palestijnse rechten verdedigen / tegenlobby voeren"
    purpose: "comparatieve power mapping"

  eu_register_actor:
    label: "EU Register actor"
    description: "EU Transparantieregister ingeschreven actor met NL-relevantie"


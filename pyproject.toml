[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lobby-nl"
version = "1.0.0"
description = "Evidence-first OSINT research pipeline for mapping lobbying practices and geopolitical influence in the Netherlands"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Research Pipeline"}]
dependencies = [
    "pandas>=2.0.0",
    "duckdb>=0.9.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.40.0",
    "readability-lxml>=0.8.0",
    "waybackpy>=3.0.0",
    "pyyaml>=6.0",
    "networkx>=3.0",
    "rapidfuzz>=3.0.0",
    "pdfplumber>=0.10.0",
    "pymupdf>=1.23.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "lxml>=4.9.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
lobby-nl = "lobby_nl.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
